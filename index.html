<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="title" content="conways game of life to sound">
  <title>Conway's Game of Life to Sound</title>
  <meta name="google" value="notranslate">
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --border: #d7dbe0;
      --text: #121417;
      --muted: #606a76;
      --accent: #0f1720;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: center;
    }

    .group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .group strong {
      color: var(--text);
      font-weight: 600;
      min-width: 32px;
      text-align: right;
    }

    input[type="range"] {
      width: 140px;
    }

    button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    button.secondary {
      background: #fff;
      color: var(--accent);
    }

    .meta {
      margin-left: auto;
      display: inline-flex;
      gap: 12px;
      font-size: 13px;
      color: var(--muted);
      align-items: center;
    }

    .meta a {
      color: #243e75;
      text-decoration: underline;
    }

    #board-wrap {
      width: 100%;
      margin: 0;
      border: 1px solid #20252a;
      background: #fff;
      overflow: auto;
      flex: 1;
    }
  </style>
</head>
<body id="body" onload="load()">
  <section class="topbar">
    <label class="group">Speed
      <input type="range" min="40" max="950" value="500" id="speedr">
    </label>
    <label class="group">
      <input type="checkbox" id="soundswitch" checked>
      Sound
    </label>
    <button id="toggle" onclick="togglebtn()">Start</button>
    <button class="secondary" id="clear-btn" type="button">Clear</button>
    <button class="secondary" id="random-btn" type="button">Random</button>
    <div class="meta">
      <span>Generation: <strong id="generation">0</strong></span>
      <span>Live Cells: <strong id="live-count">0</strong></span>
      <a href="https://github.com/recu3125/conways-game-of-life-to-sound" target="_blank" rel="noopener noreferrer">if you like this project, pease give me a star!</a>
    </div>
  </section>

  <main id="board-wrap"></main>
</body>
<script src="lifegame.js"></script>
</html>
